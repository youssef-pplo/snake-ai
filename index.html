<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Ultimate Snake AI. Train a neural network to play Snake or play yourself!">
    <meta name="author" content="youssef pplo">
    <meta name="keywords" content="snake game, neural network, AI, machine learning, game, browser game">
    <meta name="theme-color" content="#00ff88">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Snake AI Ultimate">
    <meta property="og:description" content="Train a neural network to play Snake directly in your browser.">
    <meta property="og:url" content="https://pplo.dev">
    <meta property="og:site_name" content="Snake AI Ultimate">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Snake AI Ultimate">
    <meta name="twitter:description" content="Train a neural network to play Snake directly in your browser.">
    
    <title>Snake AI Ultimate</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="score-display">0</div>
    <canvas id="gameCanvas"></canvas>

    <!-- Mobile Controls -->
    <div id="mobile-controls">
        <div class="control-row">
            <div class="d-pad-btn" onpointerdown="handleMobileInput('left')">←</div>
            <div class="d-pad-btn" onpointerdown="handleMobileInput('up')">↑</div>
            <div class="d-pad-btn" onpointerdown="handleMobileInput('down')">↓</div>
            <div class="d-pad-btn" onpointerdown="handleMobileInput('right')">→</div>
        </div>
    </div>

    <!-- AI Dashboard -->
    <div id="ai-dashboard">
        <h3>SNAKE BRAIN V1</h3>
        <div class="stat-row"><span>Gen:</span> <span id="dash-gen" class="stat-value">0</span></div>
        <div class="stat-row"><span>Alive:</span> <span id="dash-alive" class="stat-value">0</span></div>
        <div class="stat-row"><span>Best Score:</span> <span id="dash-best" class="stat-value">0</span></div>
        <div class="stat-row"><span>Current Max:</span> <span id="dash-curr" class="stat-value">0</span></div>
        
        <div class="slider-container">
            <div class="slider-label"><span>Training Speed</span><span id="speed-val">1x</span></div>
            <input type="range" id="speed-slider" min="1" max="50" value="1" oninput="updateSpeed(this.value)">
        </div>
        
        <div style="margin-top: 15px; display: grid; gap: 5px;">
             <button class="btn btn-small btn-blue" onclick="showAiConfig()">AI Config</button>
             <button class="btn btn-small btn-gray" onclick="game.endGame()">Exit Training</button>
        </div>
        <div style="margin-top:10px; font-size:10px; text-align:center; color:#555;">Drag to move</div>
    </div>

    <div id="ui-layer">
        <!-- Start Screen -->
        <div id="start-screen" class="message-box" style="display: block;">
            <h1>SNAKE AI</h1>
            <p>Master the grid or watch the AI learn!</p>
            <div class="btn-group">
                <button class="btn" onclick="startGame('normal')">Play Game</button>
                <button class="btn btn-blue" onclick="startGame('ai')">Train AI</button>
                <button class="btn btn-gray" onclick="showSettings()">Settings</button>
            </div>
            <div class="credits">
                Created by <a href="https://pplo.dev" target="_blank" rel="noopener noreferrer">youssef pplo</a>
            </div>
        </div>

        <!-- Global Settings -->
        <div id="settings-modal" class="message-box">
            <h3>Game Settings</h3>
            <p style="font-size: 0.9rem;">Graphics mode affects particles and glow.</p>
            <div class="btn-group">
                <button class="btn btn-blue" onclick="toggleGraphics()" id="gfx-btn">Graphics: HIGH</button>
                <button class="btn btn-gray" onclick="closeSettings()">Back</button>
            </div>
        </div>

        <!-- AI Config -->
        <div id="ai-config-modal" class="message-box">
            <h3>AI Logic</h3>
            <div class="setting-group">
                <label>Population Size (50 - 1000)</label>
                <input type="number" id="cfg-pop" value="200" min="50" max="1000">
            </div>
            <div class="setting-group">
                <label>Mutation Rate (0.01 - 0.5)</label>
                <input type="number" id="cfg-mut" value="0.05" step="0.01" min="0.01" max="0.5">
            </div>
            <div class="btn-group">
                <button class="btn" onclick="saveAiSettings()">Apply</button>
                <button class="btn btn-gray" onclick="closeAiConfig()">Cancel</button>
            </div>
        </div>

        <!-- Game Over -->
        <div id="game-over-screen" class="message-box">
            <h1>Game Over</h1>
            <div style="font-size: 3rem; font-weight: bold; color: var(--primary); margin: 10px 0;" id="final-score">0</div>
            <div style="color: #888; margin-bottom: 20px;">Best: <span id="best-score">0</span></div>
            
            <div class="btn-group">
                <button class="btn" onclick="game.reset()">Try Again</button>
                <button class="btn btn-blue" onclick="showMainMenu()">Main Menu</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
